<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能客服系统</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>" type="image/svg+xml">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            padding: 20px;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .chat-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .chat-history {
            height: 500px;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }
        
        .message {
            margin-bottom: 20px;
            display: flex;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.user {
            justify-content: flex-end;
        }
        
        .message.bot {
            justify-content: flex-start;
        }
        
        .message-content {
            max-width: 70%;
            padding: 15px 20px;
            border-radius: 20px;
            position: relative;
        }
        
        .user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 5px;
        }
        
        .bot .message-content {
            background: white;
            color: #333;
            border: 1px solid #e9ecef;
            border-bottom-left-radius: 5px;
        }
        
        .message-content p {
            margin: 0;
            line-height: 1.6;
        }
        
        .message-time {
            font-size: 0.8rem;
            opacity: 0.6;
            margin-top: 5px;
            text-align: right;
        }
        
        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e9ecef;
            display: flex;
            gap: 10px;
        }
        
        #query-input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e9ecef;
            border-radius: 30px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }
        
        #query-input:focus {
            border-color: #667eea;
        }
        
        #send-btn {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        #send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        #send-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        
        .upload-section {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .upload-section h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }
        
        .upload-area {
            border: 2px dashed #e9ecef;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            transition: border-color 0.3s, background 0.3s;
            cursor: pointer;
        }
        
        .upload-area:hover,
        .upload-area.dragover {
            border-color: #667eea;
            background: #f8f9ff;
        }
        
        .upload-area i {
            font-size: 3rem;
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .upload-area p {
            color: #666;
            margin: 0;
        }
        
        #text-input {
            width: 100%;
            height: 100px;
            padding: 15px;
            border: 2px solid #e9ecef;
            border-radius: 15px;
            font-size: 1rem;
            resize: none;
            outline: none;
            transition: border-color 0.3s;
            margin-bottom: 15px;
        }
        
        #text-input:focus {
            border-color: #667eea;
        }
        
        #add-btn {
            padding: 12px 25px;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        #add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(17, 153, 142, 0.4);
        }
        
        .status-bar {
            background: white;
            border-radius: 10px;
            padding: 10px 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: #666;
        }
        
        .status-online {
            color: #28a745;
            font-weight: bold;
        }
        
        .source-info {
            font-size: 0.85rem;
            color: #666;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #ddd;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .typing-indicator {
            display: flex;
            gap: 5px;
        }
        
        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out both;
        }
        
        .typing-indicator span:nth-child(1) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.3s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 智能客服系统</h1>
            <p>基于RAG技术，支持FAISS和Milvus向量检索</p>
        </div>
        
        <div class="status-bar">
            <span>服务状态: <span class="status-online">在线</span></span>
            <span>向量数据库: {{ vector_db_type }}</span>
        </div>
        
        <div class="upload-section">
            <h3>📚 添加知识库文档</h3>
            <textarea id="text-input" placeholder="请输入要添加的知识库内容，每行一条..."></textarea>
            <button id="add-btn" onclick="addDocuments()">添加文档</button>
        </div>
        
        <div class="chat-container">
            <div class="chat-history" id="chat-history">
                <div class="message bot">
                    <div class="message-content">
                        <p>您好！我是智能客服助手。请问有什么可以帮助您的？</p>
                    </div>
                </div>
            </div>
            
            <div class="input-area">
                <input type="text" id="query-input" placeholder="请输入您的问题..." onkeydown="handleKeydown(event)">
                <button id="send-btn" onclick="sendMessage()">发送</button>
            </div>
        </div>
    </div>
    
    <script>
        async function sendMessage() {
            const input = document.getElementById('query-input');
            const sendBtn = document.getElementById('send-btn');
            const chatHistory = document.getElementById('chat-history');
            
            const query = input.value.trim();
            if (!query) return;
            
            input.value = '';
            sendBtn.disabled = true;
            
            addMessage(query, 'user');
            
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message bot';
            typingDiv.innerHTML = `
                <div class="message-content">
                    <div class="typing-indicator">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            `;
            chatHistory.appendChild(typingDiv);
            scrollToBottom();
            
            try {
                const response = await fetch('/api/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });
                
                const data = await response.json();
                
                typingDiv.remove();
                addMessage(data.answer, 'bot', data.sources);
            } catch (error) {
                typingDiv.remove();
                addMessage('抱歉，服务器出现错误，请稍后重试。', 'bot');
            } finally {
                sendBtn.disabled = false;
            }
        }
        
        async function addDocuments() {
            const textInput = document.getElementById('text-input');
            const addBtn = document.getElementById('add-btn');
            
            const text = textInput.value.trim();
            if (!text) return;
            
            const texts = text.split('\n').filter(t => t.trim());
            if (texts.length === 0) return;
            
            textInput.value = '';
            addBtn.disabled = true;
            
            try {
                const response = await fetch('/api/add_documents', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ texts })
                });
                
                const data = await response.json();
                alert(data.message);
            } catch (error) {
                alert('添加文档失败，请重试');
            } finally {
                addBtn.disabled = false;
            }
        }
        
        function addMessage(text, type, sources = []) {
            const chatHistory = document.getElementById('chat-history');
            const div = document.createElement('div');
            div.className = `message ${type}`;
            
            let sourceHtml = '';
            if (sources.length > 0) {
                sourceHtml = `
                    <div class="source-info">
                        <strong>参考来源：</strong>
                        <ul>
                            ${sources.slice(0, 3).map((s, i) => `<li>${i + 1}. ${s.substring(0, 50)}${s.length > 50 ? '...' : ''}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }
            
            div.innerHTML = `
                <div class="message-content">
                    <p>${escapeHtml(text)}</p>
                    ${sourceHtml}
                </div>
            `;
            
            chatHistory.appendChild(div);
            scrollToBottom();
        }
        
        function scrollToBottom() {
            const chatHistory = document.getElementById('chat-history');
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }
        
        function handleKeydown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        async function checkHealth() {
            try {
                const response = await fetch('/api/health');
                const data = await response.json();
                if (data.status === 'healthy') {
                    document.querySelector('.status-online').textContent = '在线';
                }
            } catch (error) {
                document.querySelector('.status-online').textContent = '离线';
                document.querySelector('.status-online').style.color = '#dc3545';
            }
        }
        
        checkHealth();
        setInterval(checkHealth, 30000);
    </script>
</body>
</html>
